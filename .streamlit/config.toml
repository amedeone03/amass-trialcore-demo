[theme]
base = "dark"
primaryColor = "#7C3AED"
backgroundColor = "#0B1020"
secondaryBackgroundColor = "#111827"
textColor = "#E5E7EB"
linkColor = "#06B6D4"
borderColor = "#263244"
font = "IBM Plex Sans:https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap"
headingFont = "IBM Plex Sans:https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@500;600;700&display=swap"
codeFont = "IBM Plex Mono:https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap"
redColor = "#F87171"
orangeColor = "#F59E0B"
greenColor = "#22C55E"
blueColor = "#06B6D4"
violetColor = "#7C3AED"
grayColor = "#9CA3AF"
chartCategoricalColors = ["#7C3AED", "#06B6D4", "#22C55E", "#F59E0B", "#9CA3AF"]

[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false
